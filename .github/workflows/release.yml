name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Resolve version
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "version must look like vX.Y.Z, got: $TAG"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # svchost release contract (4-segment naming, see
      # https://github.com/crazy4chicken/nekostick-svchost/blob/main/docs/publishing.md):
      # each asset must be named dispatchub_<version>_<platform>_<arch>.zip and
      # the entry binary must sit at the ZIP root with the exact service name
      # "dispatchub" (Windows also accepts dispatchub.exe). Map GOOS/GOARCH to
      # the svchost segments: darwin -> macos, amd64 -> x64.
      - name: Resolve target names
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          PLATFORM=$GOOS; [ "$GOOS" = darwin ]  && PLATFORM=macos
          ARCH=$GOARCH;   [ "$GOARCH" = amd64 ] && ARCH=x64
          BIN=dispatchub; [ "$GOOS" = windows ] && BIN=dispatchub.exe
          { echo "PLATFORM=$PLATFORM"; echo "ARCH=$ARCH"; echo "BIN=$BIN"; } >> "$GITHUB_ENV"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=$TAG" \
            -o "dist/$BIN" ./cmd/dispatchub

      - name: Package
        run: |
          cd dist
          zip "dispatchub_${TAG}_${PLATFORM}_${ARCH}.zip" "$BIN"

      # archive: false uploads the ZIP as-is (the file name becomes the
      # artifact name), which the publish job matches by pattern.
      - name: Upload asset
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: dist/*.zip
          archive: false
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "version must look like vX.Y.Z, got: $TAG"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # skip-decompress: the uploads are raw .zip files (archive: false);
      # without this the client would unzip them and every platform would
      # clobber the same bare "dispatchub"/"dispatchub.exe" entry.
      - name: Download assets
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: dispatchub_*.zip
          path: dist
          merge-multiple: true
          skip-decompress: true

      # On manual dispatch the tag may not exist yet: gh release create
      # creates it at --target, which is the dispatched commit. Passing the
      # full SHA also keeps target_commitish a commit rather than a branch
      # name, so a commit-prefix ref can resolve the release (publishing.md
      # item 3). GH_REPO substitutes for the missing git checkout in this job.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --title "$TAG" --target "${{ github.sha }}" --generate-notes \
            || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" dist/*.zip --clobber
