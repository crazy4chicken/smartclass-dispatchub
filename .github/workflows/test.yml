name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The store integration suite is gated by DISPATCH_TEST_PG; it creates a
      # throwaway schema per test and migrates it with the production runner.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch
          POSTGRES_DB: dispatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispatch -d dispatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DISPATCH_TEST_PG: postgres://dispatch:dispatch@localhost:5432/dispatch_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1
